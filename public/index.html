<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b4a2a">
  <title>ゲームハブ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- ホーム -->
  <section id="screen-home" class="screen">
    <header class="sign">
      <h1>ゲームハブ</h1>
      <p>BOARD &amp; CARD CAFE</p>
    </header>

    <div class="panel paper">
      <label class="field">
        <span>あなたの名前</span>
        <input id="name" maxlength="12" placeholder="例：たろう" autocomplete="nickname">
      </label>
    </div>

    <div class="panel ticket paper">
      <label class="ticket-main">
        <span class="label">招待コードで参加</span>
        <input id="join-code" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters">
      </label>
      <div class="ticket-stub">
        <button id="join-btn" class="btn primary">入店</button>
      </div>
    </div>

    <h2 class="rule-title">本日の卓</h2>
    <div id="game-list" class="game-list"></div>

    <p class="hint">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      卓を選ぶとルームができて、コードを友だちに送れます
    </p>
  </section>

  <!-- ロビー -->
  <section id="screen-lobby" class="screen" hidden>
    <header class="sign">
      <h1 id="lobby-game"></h1>
      <p>WAITING ROOM</p>
    </header>
    <div class="panel lobby paper">
      <span class="label">招待コード</span>
      <div class="room-code" id="lobby-code"></div>
      <button id="copy-link" class="btn ghost small">招待リンクをコピー</button>
      <div id="lobby-body"></div>
    </div>
    <div id="lobby-chat-slot" class="chat-slot paper"></div>
    <div class="center">
      <button class="btn ghost leave-btn">退店する</button>
    </div>
  </section>

  <!-- ゲーム -->
  <section id="screen-game" class="screen" hidden>
    <header class="game-bar">
      <div class="game-bar-title">
        <span id="game-title"></span>
        <span class="room-tag">卓 <span id="game-code"></span></span>
        <span id="game-you-tag" class="you-tag" hidden></span>
      </div>
      <div class="game-bar-actions">
        <button id="rules-btn" class="btn ghost small bar-btn" aria-label="ルール">
          <span class="bar-btn-icon" aria-hidden="true">📖</span><span class="bar-btn-text">ルール</span>
        </button>
        <button id="chat-btn" class="btn ghost small bar-btn chat-btn" aria-controls="chat-col" aria-expanded="true" aria-label="チャット">
          <span class="bar-btn-icon" aria-hidden="true">💬</span><span class="bar-btn-text">チャット</span><span id="chat-badge" class="chat-badge" hidden>0</span>
        </button>
        <button id="mute-btn" class="btn ghost small icon-btn" aria-label="効果音オン" aria-pressed="true"></button>
        <button class="btn ghost small leave-btn">退店</button>
      </div>
    </header>
    <div id="game-offline" class="offline-list"></div>
    <div id="game-spectate-note" class="spectate-note"></div>
    <div id="game-grid" class="game-grid">
      <div id="game-root" class="game-root"></div>
      <aside id="chat-col" class="chat-col paper"></aside>
    </div>
    <div id="game-end" class="end-bar" hidden>
      <button id="back-lobby" class="btn primary">ロビーに戻ってもう一度</button>
      <p class="muted" id="end-wait">ホストがロビーに戻すのを待っています…</p>
    </div>
    <div id="turn-banner" class="turn-banner" hidden>あなたの番です</div>
  </section>

  <!-- チャット（スマホ用ボトムシート） -->
  <dialog id="chat-sheet" class="sheet paper">
    <div class="sheet-head">
      <button id="chat-sheet-close" class="btn ghost small">閉じる</button>
    </div>
    <div id="chat-sheet-slot" class="sheet-body"></div>
  </dialog>

  <!-- ルール（スマホ用ボトムシート） -->
  <dialog id="rules-sheet" class="sheet paper">
    <div class="sheet-head">
      <h3 class="sheet-title">ルール</h3>
      <button id="rules-sheet-close" class="btn ghost small">閉じる</button>
    </div>
    <div id="rules-sheet-body" class="sheet-body"></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <div id="conn" class="conn" hidden>接続し直しています…</div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
